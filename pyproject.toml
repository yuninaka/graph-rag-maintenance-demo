[project]
name = "graph-rag-maintenance-demo"
version = "0.1.0"
description = "設備保全ナレッジベースのグラフ×ベクトルハイブリッドRAG検証"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "neo4j>=5.20.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "weasyprint>=62.0",
    "azure-ai-documentintelligence>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "vulture",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "PLR", "N", "B", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12

[tool.mypy]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
# LangChainのChatModelクラス(ChatAnthropic等)はpydanticモデルで、コンストラクタの
# キーワード引数(model等)を動的に生成する。このプラグインなしではmypyがそれらの
# キーワード引数を認識できず、実際には正しいコードを call-arg エラーとして誤検知する。
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
